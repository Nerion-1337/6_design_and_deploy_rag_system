[project]
name = "puls-events-rag"
version = "1.1.0"
description = "POC RAG - Assistant intelligent de recommandation culturelle pour Puls-Events"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-huggingface>=0.1.2",
    "langchain-openai>=0.2.0",
    "sentence-transformers>=3.2.0",
    "faiss-cpu>=1.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "langchain-mistralai>=1.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
