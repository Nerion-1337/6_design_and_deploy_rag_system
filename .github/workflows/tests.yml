name: Tests & Évaluation RAG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de uv
        uses: astral-sh/setup-uv@v3

      - name: Installation de Python
        run: uv python install 3.11

      - name: Installation des dépendances (y compris dev/test)
        run: uv sync --frozen --extra dev

      - name: Exécution des tests unitaires et fonctionnels
        run: uv run pytest tests/ -v --junitxml=pytest-report.xml

      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Évaluation automatisée du RAG (si index et clé API disponibles)
        env:
          RAG_LLM_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -d "data/faiss_index" ] && [ -n "$NVIDIA_API_KEY" ]; then
            uv run python -m tests.evaluate_rag
          else
            echo "Index vectoriel ou clé API absents : évaluation ignorée en CI."
          fi

      - name: Publication du rapport d'évaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: tests/evaluation_report.json
          if-no-files-found: ignore
